
name: Verify Game Upgrade

on:
  push:
    branches:
      - game-upgrade

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Apply upgrade in test environment
        run: node scripts/apply-upgrade.mjs

      - name: Check TypeScript
        run: npm run lint

      - name: Build game
        run: npm run build
