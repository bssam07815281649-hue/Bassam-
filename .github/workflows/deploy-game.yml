
name: Deploy Upgraded Game

on:
  push:
    branches:
      - game-upgrade
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Fix model paths for GitHub Pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/three/assets/AssetManager.ts")
          s = p.read_text()
          s = s.replace(
              "fetch('/assets/models/manifest.json',",
              "fetch(import.meta.env.BASE_URL + 'assets/models/manifest.json',"
          )
          s = s.replace(
              "this.loadFromUrl(key, spec.path,",
              "this.loadFromUrl(key, import.meta.env.BASE_URL + spec.path.replace(/^\\//, ''),"
          )
          p.write_text(s)
          PY

      - name: Check TypeScript
        run: npm run lint

      - name: Build upgraded game
        
        run: |
          cp public/assets/models/towers/gun_turret_l1_ready.glb public/assets/models/towers/gun_turret_l1.glb
          npm run build -- --base=/Bassam-/


      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
